name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest --cov --cov-report=term-missing:skip-covered

  tenancy:
    # Separate, required status check: cross-tenant leak tests must never be skipped (§9).
    name: tenancy isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --python 3.12
      - name: Run leak tests (fails if none are collected)
        run: uv run pytest -m tenancy -v

  secrets-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eval-smoke:
    # Runs the eval harness against a live rag-api (memory backends + demo corpus) and gates
    # on regression vs the committed baseline (§10). Swap in real datasets as they land.
    name: eval smoke gate
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --python 3.12
      - name: Start rag-api
        run: |
          uv run uvicorn rag_api.main:app --port 8080 &
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
      - run: uv run rag-eval run --dataset eval/datasets/smoke.jsonl --out eval-report.json
      - run: uv run rag-eval gate --baseline eval/baselines/smoke.json --candidate eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: eval-report.json }

  images:
    name: build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint, test, tenancy]
    strategy:
      matrix:
        service: [rag-api, rag-ingest, rag-mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          tags: astra/${{ matrix.service }}:${{ github.sha }}
          push: false # TODO(platform pod): push to ACR via OIDC federated credential on main
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

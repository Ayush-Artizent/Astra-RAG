apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
spec:
  replicas: 2
  selector: { matchLabels: { app: rag-api } }
  template:
    metadata:
      labels: { app: rag-api, azure.workload.identity/use: "true" }
    spec:
      serviceAccountName: astra-rag
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: rag-api
          image: astra/rag-api:latest # pinned by digest in overlays/CD
          command: ["uvicorn", "rag_api.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "2"]
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ASTRA_ENV, value: dev }
            - { name: ASTRA_AUTH_MODE, value: entra }
            - { name: ASTRA_SEED_DEMO_DATA, value: "false" }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe: { httpGet: { path: /readyz, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
spec:
  selector: { app: rag-api }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: rag-api }
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-ingest-webhook
spec:
  replicas: 2
  selector: { matchLabels: { app: rag-ingest-webhook } }
  template:
    metadata:
      labels: { app: rag-ingest-webhook, azure.workload.identity/use: "true" }
    spec:
      serviceAccountName: astra-rag
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: webhook
          image: astra/rag-ingest:latest
          command: ["uvicorn", "rag_ingest.webhook:app", "--host", "0.0.0.0", "--port", "8081"]
          ports: [{ containerPort: 8081 }]
          env: [{ name: ASTRA_ENV, value: dev }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe: { httpGet: { path: /healthz, port: 8081 } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata:
  name: rag-ingest-webhook
spec:
  selector: { app: rag-ingest-webhook }
  ports: [{ port: 80, targetPort: 8081 }]

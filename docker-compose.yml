# Local infrastructure. Azure AI Search and Service Bus have no faithful local emulators, so
# locally the services default to in-memory backends; Postgres and Blob (Azurite) are real.
#   docker compose up -d                 # infra only
#   docker compose --profile app up -d   # infra + rag-api + webhook receiver in containers
name: astra-rag

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra # local only
      POSTGRES_DB: astra
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra"]
      interval: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --loose
    ports: ["10000:10000"]

  jaeger: # OTel trace viewer at http://localhost:16686
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  rag-api:
    profiles: ["app"]
    build: { context: ., dockerfile: deploy/docker/Dockerfile, args: { SERVICE: rag-api } }
    command: ["uvicorn", "rag_api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: [.env]
    environment:
      ASTRA_POSTGRES_DSN: postgresql://astra:astra@postgres:5432/astra
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy } }

  rag-ingest-webhook:
    profiles: ["app"]
    build: { context: ., dockerfile: deploy/docker/Dockerfile, args: { SERVICE: rag-ingest } }
    command: ["uvicorn", "rag_ingest.webhook:app", "--host", "0.0.0.0", "--port", "8081"]
    env_file: [.env]
    ports: ["8081:8081"]

volumes:
  pgdata:

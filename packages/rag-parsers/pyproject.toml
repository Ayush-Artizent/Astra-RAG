[project]
name = "rag-parsers"
version = "0.1.0"
description = "Parser/chunker plugin interface and built-in chunkers for Astra RAG"
requires-python = ">=3.12"
dependencies = ["rag-core"]

[project.optional-dependencies]
# tree-sitter chunkers for the top customer languages (§5, Phase 1)
treesitter = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_parsers"]

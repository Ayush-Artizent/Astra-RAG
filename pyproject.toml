[project]
name = "astra-rag"
version = "0.1.0"
description = "Connect a GitHub repo, validate its structure, and clone it for RAG"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110",
    "fastembed>=0.9.1",
    "jinja2>=3.1",
    "markitdown[docx]>=0.1.9",
    "pydantic-settings>=2.16.1",
    "qdrant-client>=1.20.0",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[project.scripts]
astra-rag = "astra_rag:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[project]
name = "astra-rag"
version = "0.1.0"
description = "Connect a GitHub or Azure DevOps golden repo, validate its structure, and clone and index it for RAG"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.110",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "markitdown[docx]>=0.1.9",
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
astra-rag = "astra_rag:main"
astra-mcp = "astra_mcp:main"
astra-mcp-demo = "astra_mcp.demo:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Two top-level modules: the FastAPI app and the MCP server, which is spawned per client and must
# not import `astra_rag` (that would pull in FastAPI, the registry and the sync worker on startup).
module-name = ["astra_rag", "astra_mcp"]

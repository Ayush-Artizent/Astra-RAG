[project]
name = "astra-rag-sdk"
version = "0.1.0"
description = "Python SDK for the Astra RAG API"
requires-python = ">=3.12"
dependencies = ["rag-core", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_rag_sdk"]

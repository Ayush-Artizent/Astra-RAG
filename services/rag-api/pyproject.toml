[project]
name = "rag-api"
version = "0.1.0"
description = "Astra RAG core retrieval API (FastAPI). MCP server and SDKs are thin wrappers over it."
requires-python = ">=3.12"
dependencies = [
    "rag-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
azure = [
    "azure-search-documents>=11.5",
    "azure-identity>=1.19",
    "openai>=1.54",
    "azure-monitor-opentelemetry>=1.6",
    "psycopg[binary,pool]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_api"]

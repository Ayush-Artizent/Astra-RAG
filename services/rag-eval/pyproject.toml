[project]
name = "rag-eval"
version = "0.1.0"
description = "Astra RAG offline eval harness and CI regression gate"
requires-python = ">=3.12"
dependencies = ["rag-core", "astra-rag-sdk"]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

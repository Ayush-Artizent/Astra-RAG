[project]
name = "rag-ingest"
version = "0.1.0"
description = "Astra RAG ingestion: webhook receiver, incremental indexing workers, reconciler"
requires-python = ">=3.12"
dependencies = [
    "rag-core",
    "rag-parsers",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
azure = ["azure-servicebus>=7.12", "azure-storage-blob>=12.23", "azure-identity>=1.19"]
pii = ["presidio-analyzer>=2.2"]

[project.scripts]
rag-ingest-worker = "rag_ingest.worker:main"
rag-ingest-reconcile = "rag_ingest.reconciler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ingest"]

[project]
name = "rag-mcp"
version = "0.1.0"
description = "MCP server exposing Astra RAG tools to agents (thin wrapper over rag-api via the SDK)"
requires-python = ">=3.12"
dependencies = ["astra-rag-sdk", "mcp>=2.3,<3"]

[project.scripts]
rag-mcp = "rag_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]
